{% extends 'base.html' %}
{% load static %}
{% block title %} Plum Store! Featuring local Omaha, NE music and more! {% endblock %}
{% block css %}{% endblock %}
{% block header %}
    <link href="{% static 'css/store.css' %}" rel="stylesheet">
    <div class="base-top">
        
        <a href="{% url 'storeall' %}">
        <div class="left">
            <h1 style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">STORE</h1>
        </div></a>
        <a href="{% url 'checkout' %}"><div class="menubutton cartbutton">
            <img class="cartbuttonimg" id='cartbuttonimg' src="{% static 'images/Cart.svg' %}">
        </div></a>
        <div onclick="openMenu()" style="background-color: lightskyblue;" class="menubutton" id="menubutton">
            <img id='menubuttonimg' src="{% static 'images/Hamburger.svg' %}">
        </div>
    </div>
    <div class="top-spacer"></div>
    <div class="menu" id="menu">
        <a href="{% url 'index' %}"><div class="first"><h1>HOME</h1></div></a>
        <a href="{% url 'articlelist' %}"><div><h1>LIBRARY</h1></div></a>
        <a href="{% url 'about' %}"><div><h1>ABOUT</h1></div></a>
        {% if user.is_admin %}<a href="{% url 'admin' %}"><div><h1>ADMIN</h1></div></a>{% endif %}
    </div>
{% endblock %}
