{% load static %}


<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <table width="500">

        <tr>

            <td>
                 {{ form.category }}
            </td>
            <td>
                {{ form.author }}
            </td>
        </tr>
        <tr>
            <td colspan="2">{{ form.title }} </td>
        </tr>
        <tr><td colspan="2">{{ form.image }}</td>
        </tr>
        <tr><td colspan="2">{{ form.content }}   <div id="editor"></div></td></tr>
    </table>
 
    <button type="submit">Submit</button>
</form>



<!-- Include the Quill library -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<!-- Initialize Quill editor -->

const quill = new Quill('#id_content', {

  modules: {
    toolbar: [
      ['bold', 'italic'],
      ['link', 'blockquote', 'code-block', 'image'],

    ],

  theme: 'snow',

</script>

{% if form.instance.id %}
    <a href="{% url 'deletemodel' modelname=model id=form.instance.id %}">DELETE</a>
{% endif %}
