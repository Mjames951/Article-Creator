{% extends 'shop/storebase.html' %}
{% load static %}
{% block title %}checkout{% endblock %}
{% block css %}{% endblock %}
{% block script %}
<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe('pk_live_51RYSbdHwWuTfhb2f7wpW6BzFngnmSC8uwZT69a10HQzL8ItCqcZXuEtJSqjV8HcBxtyH4C1yMvJ9OCQ1OQYEtj3u00TEF9R03S');
    initialize();

    

    async function initialize(){
        const checkout = await stripe.initEmbeddedCheckout({
            clientSecret:'{{ client_secret }}',
        });


        checkout.mount('#checkout');
    }

    setTimeout(function(){
        window.location="{% url 'cancelorder' orderID=orderID %}";
    }, 1000*60*45);
</script>
{% endblock %}
    
{% block content %}
    
    <div style="padding: 0; width: 90%;"id="checkout" class="section">

    </div>
    <div style="width: 90%; margin: 0 auto;">
        <div style="
            border: .5rem solid black; 
            background-color: lightpink; 
            font-size: 1.5rem;
            font-weight: bold; 
            text-align: center; 
            border-radius: .5rem;
            display: inline-block;
            padding: .5rem;
            border-radius: 1rem;
            box-shadow: .25rem .25rem 0 0 black;">
            <a href="{% url 'cancelorder' orderID=orderID %}">cancel</a>
        </div>
    </div>
{% endblock %}
